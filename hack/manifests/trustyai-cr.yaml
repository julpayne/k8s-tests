# The TrustyAI module resource the module operator reconciles. Mirrors
# trustyai-operator-module/tests/e2e/manifests/trustyai-cr.yaml in the operator
# repository, with every service enabled.
apiVersion: components.platform.opendatahub.io/v1alpha1
kind: TrustyAI
metadata:
  name: default-trustyai
spec:
  managementState: Managed
  enabledServices:
    tas: true
    lmes: true
    evalHub: true
    nemoGuardrails: true
