[project]
name = "k8s-tests"
version = "0.1.0"
description = "Kubernetes-level tests and harnesses for the TrustyAI components"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43",
    "kubernetes>=31.0.0",
    "pytest>=8.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest-html>=4.1",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "evalhub: checks for the EvalHub instance the workload operator deploys",
    "emulator: checks for the LLM emulator and the token it requires",
    "benchmark: checks that submit an evaluation job and read its results",
    "module: checks for the TrustyAI module operator and the TrustyAI resource it reconciles",
    "workload: checks for the TrustyAI workload (service) operator",
]
addopts = [
    "-ra",
    "-v",
    "--strict-config",
    "--strict-markers",
    "--durations=10",
    "--html=reports/report.html",
    "--self-contained-html",
]
# The API checks reach EvalHub through a port-forward, where the harness certificate
# cannot match 127.0.0.1; they are not TLS tests.
filterwarnings = ["ignore::urllib3.exceptions.InsecureRequestWarning"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)-8s %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
