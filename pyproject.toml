[project]
name = "k8s-tests"
version = "0.1.0"
description = "Kubernetes-level tests and harnesses for the TrustyAI components"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kubernetes>=31.0.0",
    "pytest>=8.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
